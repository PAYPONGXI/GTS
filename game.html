<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Song - XXXTENTACION</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Game-specific styles */
        .game-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            color: white;
            font-family: 'Kanit', sans-serif;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .game-container.page-enter {
            opacity: 1;
        }

        .back-to-menu {
            display: inline-block;
            margin-bottom: 10px;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-to-menu:hover {
            color: white;
            text-decoration: underline;
        }

        .game-header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .artist-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }

        .artist-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .artist-name {
            font-size: 36px;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .game-subtitle {
            font-size: 18px;
            color: rgba(255,255,255,0.9);
            margin-top: 5px;
        }

        .game-main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .game-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .stat-label {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: white;
        }

        .game-area {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .timer-ring {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: conic-gradient(#4caf50 calc(var(--progress, 1) * 360deg), rgba(255,255,255,0.1) 0deg);
            transition: background 0.3s linear;
        }

        .timer-ring::before {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            background: #2d2d2d;
            z-index: 0;
        }

        .timer-container.warning .timer-ring {
            background: conic-gradient(#ff6b6b calc(var(--progress, 1) * 360deg), rgba(255,255,255,0.1) 0deg);
        }

        .timer-text {
            position: relative;
            z-index: 1;
            font-size: 32px;
            font-weight: 700;
            color: white;
            min-width: 60px;
            text-align: center;
        }

        .timer-container.warning .timer-text {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .answer-section {
            margin-bottom: 30px;
        }

        .answer-input {
            width: 100%;
            max-width: 400px;
            padding: 15px 20px;
            font-size: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .answer-input:focus {
            outline: none;
            border-color: #ff6b6b;
            background: rgba(255,255,255,0.15);
        }

        .answer-input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .answer-input.shake {
            animation: shake 0.4s ease;
            border-color: #f44336;
        }

        .answer-input.correct-glow {
            border-color: #4caf50;
            box-shadow: 0 0 15px rgba(76,175,80,0.6);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .submit-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,107,107,0.3);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,107,107,0.4);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            display: none;
            animation: feedbackSlide 0.4s ease;
        }

        @keyframes feedbackSlide {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .feedback.incorrect {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .stat-card {
            position: relative;
        }

        .score-delta {
            position: absolute;
            top: -10px;
            right: 10px;
            font-size: 16px;
            font-weight: 700;
            pointer-events: none;
            animation: floatUp 1s ease forwards;
        }

        .score-delta.positive { color: #4caf50; }
        .score-delta.negative { color: #f44336; }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-25px); }
        }

        .countdown {
            display: none;
            justify-content: center;
            align-items: center;
            height: 300px;
        }

        .countdown-number {
            font-size: 120px;
            font-weight: 800;
            color: #ff6b6b;
            text-shadow: 0 0 30px rgba(255,107,107,0.5);
            animation: countdownPulse 1s ease-in-out;
        }

        @keyframes countdownPulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .overlay-content {
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .overlay h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        .overlay p {
            font-size: 18px;
            margin-bottom: 30px;
            color: rgba(255,255,255,0.8);
        }

        .reset-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover {
            transform: scale(1.05);
        }

        .score-update {
            animation: scoreFlash 0.5s ease;
        }

        @keyframes scoreFlash {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); color: #ff6b6b; }
        }

        .new-high-score-badge {
            color: #ffd700;
            font-weight: 700;
            font-size: 18px;
            animation: pulse 1s infinite;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .artist-name {
                font-size: 28px;
            }
            
            .artist-image {
                width: 60px;
                height: 60px;
            }
            
            .game-main {
                margin: 20px auto;
                padding: 0 15px;
            }
            
            .game-area {
                padding: 30px 20px;
            }
            
            .timer-text {
                font-size: 36px;
            }
            
            .countdown-number {
                font-size: 80px;
            }
        }

    </style>
</head>
<body class="game-container">
    <!-- Game Header -->
    <header class="game-header">
        <div class="container">
            <a href="international.html" class="back-to-menu">← กลับสู่เมนูหลัก</a>
            <div class="artist-info">
                <img id="header-artist-image" src="images/XXXTENTACION.jpg" alt="XXXTENTACION" class="artist-image" onerror="this.style.display='none';">
                <h1 class="artist-name" id="header-artist-name">XXXTENTACION</h1>
            </div>
            <p class="game-subtitle" id="header-game-subtitle">ทายเพลงของ XXXTENTACION และทดสอบความรู้เพลงของคุณ!</p>
        </div>
    </header>

    <!-- Main Game Content -->
    <main class="game-main">
        <!-- Game Stats -->
        <section class="game-stats">
            <div class="stat-card">
                <div class="stat-label">คะแนน</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">ระดับ</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">รอบที่</div>
                <div class="stat-value">
                    <span id="current-round">1</span>/<span id="total-rounds">3</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">สูงสุด</div>
                <div class="stat-value" id="high-score">0</div>
            </div>
        </section>

        <!-- Countdown -->
        <div id="countdown" class="countdown">
            <div class="countdown-number" id="countdown-number">3</div>
        </div>

        <!-- Game Area -->
        <section id="game-area" class="game-area">
            <!-- Timer -->
            <div class="timer-container">
                <div class="timer-ring">
                    <span class="timer-text" id="timer-text">15</span>
                </div>
            </div>

            <!-- Answer Section -->
            <div class="answer-section">
                <input 
                    type="text" 
                    id="answer-input" 
                    class="answer-input" 
                    placeholder="พิมพ์ชื่อเพลงที่นี่..."
                    autocomplete="off"
                    disabled
                >
                <br>
                <button id="submit-btn" class="submit-btn" disabled>
                    ส่งคำตอบ
                </button>
            </div>

            <!-- Feedback -->
            <div id="feedback" class="feedback"></div>
        </section>
    </main>

    <!-- Overlays -->
    <div id="level-complete" class="overlay">
        <div class="overlay-content">
            <h2>ระดับ <span id="next-level">2</span>!</h2>
            <p>ยอดเยี่ยม! คุณผ่านระดับนี้แล้ว</p>
        </div>
    </div>

    <div id="game-over" class="overlay">
        <div class="overlay-content">
            <h2>เกมจบ!</h2>
            <p>คะแนนสุดท้าย: <span id="final-score">0</span></p>
            <p id="new-high-score-badge" class="new-high-score-badge" style="display:none;">🏆 สถิติสูงสุดใหม่!</p>
            <button id="reset-btn" class="reset-btn">เล่นใหม่</button>
        </div>
    </div>

    <div id="all-songs-played" class="overlay">
        <div class="overlay-content">
            <h2>เล่นครบทุกเพลงแล้ว!</h2>
            <p>คุณได้ทายเพลงทุกเพลงของ <span id="all-songs-played-artist">XXXTENTACION</span> แล้ว</p>
            <p id="new-high-score-badge-2" class="new-high-score-badge" style="display:none;">🏆 สถิติสูงสุดใหม่!</p>
            <button id="reset-btn-2" class="reset-btn">เล่นใหม่</button>
        </div>
    </div>

    <!-- Modified Script -->
    <script src="js/artists-data.js"></script>
    <script src="js/songs-data.js"></script>
    <script>
        // Fade in on load
        requestAnimationFrame(() => document.body.classList.add('page-enter'));

        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const artistId = urlParams.get('artist') || 'xxxtentacion';

        const artistInfo = mockArtists.find(artist => artist.id === artistId);
        const songs = artistSongs[artistId] || [];

        if (!artistInfo) {
            // Unknown artist id
            document.body.innerHTML = `
                <div class="game-container">
                    <div class="game-main">
                        <a href="international.html" class="back-to-menu">← กลับสู่เมนูหลัก</a>
                        <div class="game-area">
                            <h2 style="color: #ff6b6b; margin-bottom: 20px;">🚫 Artist Not Found</h2>
                            <p style="color: white; margin-bottom: 30px;">We couldn't find that artist.</p>
                            <button onclick="history.back()" class="submit-btn">Go Back</button>
                        </div>
                    </div>
                </div>
            `;
        } else if (songs.length === 0) {
            // Artist exists but has no songs loaded yet
            document.body.innerHTML = `
                <div class="game-container">
                    <div class="game-main">
                        <a href="international.html" class="back-to-menu">← กลับสู่เมนูหลัก</a>
                        <div class="game-area">
                            <h2 style="color: #ff6b6b; margin-bottom: 20px;">🚧 Coming Soon</h2>
                            <p style="color: white; margin-bottom: 30px;">Songs for ${artistInfo.name} aren't available yet.</p>
                            <p style="color: rgba(255,255,255,0.7); margin-bottom: 30px;">Please go back and pick another artist.</p>
                            <button onclick="history.back()" class="submit-btn">Go Back</button>
                        </div>
                    </div>
                </div>
            `;
        } else {
            // Populate header with the selected artist's info
            document.title = `Guess The Song - ${artistInfo.name}`;
            document.getElementById('header-artist-image').src = artistInfo.image;
            document.getElementById('header-artist-image').alt = artistInfo.name;
            document.getElementById('header-artist-name').textContent = artistInfo.name;
            document.getElementById('header-game-subtitle').textContent = `ทายเพลงของ ${artistInfo.name} และทดสอบความรู้เพลงของคุณ!`;
            document.getElementById('all-songs-played-artist').textContent = artistInfo.name;

            // Generic game state, driven by the selected artist's songs
            class Game {
            constructor(songs) {
                this.allSongs = songs;

                // Game variables
                this.availableSongs = [...this.allSongs];
                this.currentSong = null;
                this.score = 0;
                this.level = 1;
                this.currentRound = 1;
                this.songsPerLevel = { 1: 3, 2: 5, 3: 7 };
                this.totalRounds = this.songsPerLevel[this.level];
                this.timer = null;
                this.timeLeft = 15;
                this.isPlaying = false;
                
                // Difficulty system
                this.difficulty = 'medium';
                this.difficultySettings = {
                    easy: { maxDistance: 3, minSimilarity: 0.7 },
                    medium: { maxDistance: 2, minSimilarity: 0.8 },
                    hard: { maxDistance: 1, minSimilarity: 0.9 }
                };
                
                // DOM elements
                this.elements = {
                    scoreDisplay: document.getElementById('score'),
                    levelDisplay: document.getElementById('level'),
                    currentRoundDisplay: document.getElementById('current-round'),
                    totalRoundsDisplay: document.getElementById('total-rounds'),
                    countdown: document.getElementById('countdown'),
                    countdownNumber: document.getElementById('countdown-number'),
                    gameArea: document.getElementById('game-area'),
                    timerText: document.getElementById('timer-text'),
                    answerInput: document.getElementById('answer-input'),
                    submitBtn: document.getElementById('submit-btn'),
                    feedback: document.getElementById('feedback'),
                    levelComplete: document.getElementById('level-complete'),
                    nextLevelDisplay: document.getElementById('next-level'),
                    gameOver: document.getElementById('game-over'),
                    finalScoreDisplay: document.getElementById('final-score'),
                    allSongsPlayed: document.getElementById('all-songs-played'),
                    resetBtn: document.getElementById('reset-btn'),
                    resetBtn2: document.getElementById('reset-btn-2'),
                    highScoreDisplay: document.getElementById('high-score'),
                    newHighScoreBadge: document.getElementById('new-high-score-badge'),
                    newHighScoreBadge2: document.getElementById('new-high-score-badge-2')
                };

                this.artistId = artistId;
                this.highScoreKey = `gts_highscore_${artistId}`;
                this.highScore = 0;

                this.songAudio = new Audio();
                this.songAudio.addEventListener('error', () => {
                    console.error(`Could not load audio file: ${this.currentSong && this.currentSong.file}`, this.songAudio.error);
                });

                this.init();
            }
            
            init() {
                // Create AudioContext after user interaction
                document.addEventListener('click', () => {
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        console.log('AudioContext initialized');
                    }
                }, { once: true });

                this.elements.submitBtn.addEventListener('click', () => this.checkAnswer());
                this.elements.answerInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.checkAnswer();
                });
                this.elements.resetBtn.addEventListener('click', () => this.resetGame());
                this.elements.resetBtn2.addEventListener('click', () => this.resetGame());

                this.loadHighScore();

                // Start game
                setTimeout(() => {
                    this.startNewRound();
                }, 100);
            }

            // High score / leaderboard (localStorage)
            loadHighScore() {
                this.highScore = Number(localStorage.getItem(this.highScoreKey)) || 0;
                this.elements.highScoreDisplay.textContent = this.highScore;
            }

            saveHighScoreIfBeaten() {
                const beaten = this.score > this.highScore;

                if (beaten) {
                    this.highScore = this.score;
                    localStorage.setItem(this.highScoreKey, this.highScore);
                    this.elements.highScoreDisplay.textContent = this.highScore;

                    const leaderboard = this.getLeaderboard();
                    leaderboard.push({
                        score: this.score,
                        artistId: this.artistId,
                        artistName: artistInfo.name,
                        level: this.level,
                        date: new Date().toISOString()
                    });
                    leaderboard.sort((a, b) => b.score - a.score);
                    leaderboard.splice(10);
                    localStorage.setItem('gts_highscores_all', JSON.stringify(leaderboard));
                }

                return beaten;
            }

            getLeaderboard() {
                const saved = localStorage.getItem('gts_highscores_all');
                return saved ? JSON.parse(saved) : [];
            }

            // Web Audio API beep sound
            playBeep() {
                if (!this.audioContext) return;

                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);

                oscillator.frequency.value = 800;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(
                    0.01,
                    this.audioContext.currentTime + 0.15
                );

                oscillator.start();
                oscillator.stop(this.audioContext.currentTime + 0.15);
            }

            // Countdown with beeps
            async startCountdown() {
                this.elements.countdown.style.display = 'flex';
                this.elements.gameArea.style.display = 'none';
                
                for (let i = 3; i >= 1; i--) {
                    this.elements.countdownNumber.textContent = i;
                    this.playBeep();
                    await this.sleep(1000);
                }
                
                this.elements.countdownNumber.textContent = 'GO!';
                this.playBeep();
                await this.sleep(500);
                
                this.elements.countdown.style.display = 'none';
                this.elements.gameArea.style.display = 'block';
                
                this.startRound();
            }
            
            sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }
            
            // Start a new round
            startNewRound() {
                if (this.availableSongs.length === 0) {
                    this.showAllSongsPlayed();
                    return;
                }
                
                if (this.currentRound > this.totalRounds) {
                    if (this.level < 3) {
                        this.showLevelComplete();
                        return;
                    } else {
                        this.showGameOver();
                        return;
                    }
                }
                
                this.updateDisplay();
                this.startCountdown();
            }
            
            // Start the actual round
            startRound() {
                // Select random song
                const randomIndex = Math.floor(Math.random() * this.availableSongs.length);
                this.currentSong = this.availableSongs[randomIndex];
                this.availableSongs.splice(randomIndex, 1);

                // Reset timer
                this.timeLeft = 15;
                this.updateTimerDisplay();

                // Enable input
                this.elements.answerInput.disabled = false;
                this.elements.submitBtn.disabled = false;
                this.elements.answerInput.value = '';
                this.elements.answerInput.focus();

                this.playCurrentSong();
                this.startTimer();
                this.isPlaying = true;
            }

            // Play the current round's song clip
            playCurrentSong() {
                this.songAudio.pause();
                this.songAudio.currentTime = 0;
                this.songAudio.src = this.currentSong.file
                    .split('/')
                    .map(segment => encodeURIComponent(segment))
                    .join('/');

                this.songAudio.play()
                    .then(() => console.log(`Playing: ${this.currentSong.file}`))
                    .catch(err => console.error(`Playback failed for "${this.currentSong.file}":`, err));
            }

            stopCurrentSong() {
                this.songAudio.pause();
                this.songAudio.currentTime = 0;
            }

            // Timer management
            startTimer() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }

                this.timer = setInterval(() => {
                    if (!this.isPlaying) return;

                    this.timeLeft--;
                    this.updateTimerDisplay();

                    if (this.timeLeft <= 0) {
                        this.timeLeft = 0;
                        this.updateTimerDisplay();
                        clearInterval(this.timer);
                        this.timer = null;
                        this.timeUp();
                    }
                }, 1000);
            }

            stopTimer() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }
            
            updateTimerDisplay() {
                this.elements.timerText.textContent = this.timeLeft;

                const ring = this.elements.timerText.parentElement;
                const container = ring.parentElement;
                ring.style.setProperty('--progress', this.timeLeft / 15);

                if (this.timeLeft <= 5) {
                    container.classList.add('warning');
                } else {
                    container.classList.remove('warning');
                }
            }
            
            // Time up handler
            timeUp() {
                this.stopTimer();
                this.stopCurrentSong();
                this.isPlaying = false;

                this.updateScore(-2);
                this.showFeedback(false, `Time's up! The answer was: ${this.currentSong.name}`);

                setTimeout(() => {
                    this.currentRound++;
                    this.startNewRound();
                }, 3000);
            }

            // Levenshtein distance algorithm
            calculateLevenshteinDistance(str1, str2) {
                const matrix = [];
                
                for (let i = 0; i <= str2.length; i++) {
                    matrix[i] = [i];
                }
                
                for (let j = 0; j <= str1.length; j++) {
                    matrix[0][j] = j;
                }
                
                for (let i = 1; i <= str2.length; i++) {
                    for (let j = 1; j <= str1.length; j++) {
                        if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                            matrix[i][j] = matrix[i - 1][j - 1];
                        } else {
                            matrix[i][j] = Math.min(
                                matrix[i - 1][j - 1] + 1,
                                matrix[i][j - 1] + 1,
                                matrix[i - 1][j] + 1
                            );
                        }
                    }
                }
                
                return matrix[str2.length][str1.length];
            }
            
            // Normalize text for better matching
            normalizeText(text) {
                return text
                    .toLowerCase()
                    .trim()
                    .replace(/[!?.,;:'"\-\_\(\)\[\]]/g, '')
                    .replace(/\s+/g, ' ')
                    .replace(/\b(the|a|an)\b/g, '')
                    .trim();
            }
            
            // Calculate similarity percentage
            calculateSimilarity(userAnswer, correctAnswer) {
                const normalizedUser = this.normalizeText(userAnswer);
                const normalizedCorrect = this.normalizeText(correctAnswer);
                
                if (normalizedUser === normalizedCorrect) {
                    return 1.0;
                }
                
                const distance = this.calculateLevenshteinDistance(normalizedUser, normalizedCorrect);
                const maxLength = Math.max(normalizedUser.length, normalizedCorrect.length);
                
                if (maxLength === 0) return 0;
                
                const similarity = 1 - (distance / maxLength);
                return Math.max(0, similarity);
            }
            
            // Check answer
            checkAnswerIntelligently(userAnswer) {
                const settings = this.difficultySettings[this.difficulty];
                const similarity = this.calculateSimilarity(userAnswer, this.currentSong.name);
                const distance = this.calculateLevenshteinDistance(
                    this.normalizeText(userAnswer), 
                    this.normalizeText(this.currentSong.name)
                );
                
                if (similarity >= 0.95) {
                    return { correct: true, score: 5, message: "Perfect! 🎉" };
                } else if (similarity >= settings.minSimilarity && distance <= settings.maxDistance) {
                    const score = similarity >= 0.9 ? 5 : similarity >= 0.8 ? 3 : 1;
                    return { 
                        correct: true, 
                        score: score, 
                        message: score === 5 ? "Excellent! 🎉" : score === 3 ? "Good! 👍" : "Close enough! 😊" 
                    };
                } else if (similarity >= 0.5) {
                    return { 
                        correct: false, 
                        score: -1, 
                        message: `Almost! The answer was: ${this.currentSong.name}` 
                    };
                } else {
                    return { 
                        correct: false, 
                        score: -2, 
                        message: `Wrong! The answer was: ${this.currentSong.name}` 
                    };
                }
            }
            
            // Check answer
            checkAnswer() {
                if (!this.isPlaying || this.elements.submitBtn.disabled) return;

                const userAnswer = this.elements.answerInput.value.trim();
                if (!userAnswer) return;

                this.stopTimer();
                this.stopCurrentSong();
                this.isPlaying = false;

                this.elements.answerInput.disabled = true;
                this.elements.submitBtn.disabled = true;

                const result = this.checkAnswerIntelligently(userAnswer);
                this.updateScore(result.score);
                this.showFeedback(result.correct, result.message);

                const delay = result.correct ? 1500 : 3000;
                setTimeout(() => {
                    this.currentRound++;
                    this.startNewRound();
                }, delay);

                this.elements.answerInput.value = "";
            }
            
            updateScore(points) {
                this.score += points;
                this.elements.scoreDisplay.textContent = this.score;

                const statCard = this.elements.scoreDisplay.parentElement;
                statCard.classList.add('score-update');
                setTimeout(() => {
                    statCard.classList.remove('score-update');
                }, 500);

                if (points !== 0) {
                    const delta = document.createElement('div');
                    delta.className = `score-delta ${points > 0 ? 'positive' : 'negative'}`;
                    delta.textContent = points > 0 ? `+${points}` : `${points}`;
                    statCard.appendChild(delta);
                    setTimeout(() => delta.remove(), 1000);
                }
            }

            showFeedback(isCorrect, message) {
                this.elements.feedback.textContent = message;
                this.elements.feedback.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
                this.elements.feedback.style.display = 'block';

                this.elements.answerInput.classList.remove('shake', 'correct-glow');
                this.elements.answerInput.classList.add(isCorrect ? 'correct-glow' : 'shake');
                setTimeout(() => {
                    this.elements.answerInput.classList.remove('shake', 'correct-glow');
                }, 500);

                setTimeout(() => {
                    this.elements.feedback.style.display = 'none';
                }, 2500);
            }
            
            updateDisplay() {
                this.elements.currentRoundDisplay.textContent = this.currentRound;
                this.elements.totalRoundsDisplay.textContent = this.totalRounds;
                this.elements.levelDisplay.textContent = this.level;
            }
            
            showLevelComplete() {
                this.elements.levelComplete.style.display = 'flex';
                this.elements.gameArea.style.display = 'none';
                this.elements.nextLevelDisplay.textContent = this.level + 1;
                
                setTimeout(() => {
                    this.elements.levelComplete.style.display = 'none';
                    this.level++;
                    this.currentRound = 1;
                    this.totalRounds = this.songsPerLevel[this.level];
                    this.startNewRound();
                }, 3000);
            }
            
            showGameOver() {
                const beaten = this.saveHighScoreIfBeaten();
                this.elements.gameOver.style.display = 'flex';
                this.elements.gameArea.style.display = 'none';
                this.elements.finalScoreDisplay.textContent = this.score;
                this.elements.newHighScoreBadge.style.display = beaten ? 'block' : 'none';
            }

            showAllSongsPlayed() {
                const beaten = this.saveHighScoreIfBeaten();
                this.elements.allSongsPlayed.style.display = 'flex';
                this.elements.gameArea.style.display = 'none';
                this.elements.newHighScoreBadge2.style.display = beaten ? 'block' : 'none';
            }
            
            resetGame() {
                this.stopTimer();
                this.stopCurrentSong();

                this.availableSongs = [...this.allSongs];
                this.currentSong = null;
                this.score = 0;
                this.level = 1;
                this.currentRound = 1;
                this.totalRounds = this.songsPerLevel[this.level];
                this.isPlaying = false;
                this.timeLeft = 15;
                
                this.elements.scoreDisplay.textContent = '0';
                this.elements.timerText.textContent = '15';
                this.elements.timerText.parentElement.classList.remove('warning');
                this.updateDisplay();
                
                this.elements.gameOver.style.display = 'none';
                this.elements.allSongsPlayed.style.display = 'none';
                this.elements.levelComplete.style.display = 'none';
                this.elements.feedback.style.display = 'none';
                this.elements.newHighScoreBadge.style.display = 'none';
                this.elements.newHighScoreBadge2.style.display = 'none';
                
                this.elements.answerInput.value = '';
                this.elements.answerInput.disabled = true;
                this.elements.submitBtn.disabled = true;
                
                setTimeout(() => {
                    this.startNewRound();
                }, 500);
            }
        }

        // Initialize game when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new Game(songs);
        });
        } // Close the else block for artist validation
    </script>
